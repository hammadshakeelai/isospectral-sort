[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isospectralsort"
version = "0.1.0"
authors = [
  { name="IsospectralSort Contributors" },
]
description = "Continuous dynamical, Lie-algebraic, and soliton sorting systems in Python"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
vis = [
    "streamlit>=1.20.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
